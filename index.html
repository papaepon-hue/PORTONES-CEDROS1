<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlYnHcFv3xLIM4CRw04e2a4sMqAx_uguBTxVIlMvI7OmuyMFNqpBTRkieT7LLQqPAZKA/exec";

  window.onload = () => {
    document.getElementById('usuario').value = localStorage.getItem('usuario') || '';
    document.getElementById('clave').value = localStorage.getItem('clave') || '';
  };

  async function enviarComando(puerta, nombrePuerta) {
    const user = document.getElementById('usuario').value.trim();
    const pass = document.getElementById('clave').value.trim();

    if (!user || !pass) {
      mostrarStatus("Completa usuario y clave");
      return;
    }

    mostrarStatus("Verificando credenciales...");

    try {
      // Enviamos como URLSearchParams para poder leer la respuesta directa del Apps Script
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ usuario: user, clave: pass, puerta: puerta })
      });

      const textoRespuesta = await response.text();

      // Evaluamos el contenido de la respuesta de Google Sheets
      if (textoRespuesta.includes("OK") || response.ok) {
        localStorage.setItem('usuario', user);
        localStorage.setItem('clave', pass);
        mostrarStatus("Petición enviada a " + nombrePuerta);
      } else {
        mostrarStatus("Error de autenticación: usuario o clave incorrectos");
      }
    } catch (error) {
      // Si el script redirige y da CORS, hacemos un fallback seguro
      mostrarStatus("Error al validar credenciales");
    }
  }

  function mostrarStatus(texto) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = texto;
    setTimeout(() => { statusDiv.innerText = ""; }, 5000);
  }
</script>
